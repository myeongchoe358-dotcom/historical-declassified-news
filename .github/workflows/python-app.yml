name: Python application

on:
  push:
    branches: [ "main" ]
  schedule:
    # 每天北京时间 08:00（UTC 时间 00:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Create .env File
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "EMAIL_ADDRESS=${EMAIL_ADDRESS}" > .env
          echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> .env

      - name: Run Main Workflow
        run: |
          python -c "
          import data_crawler, content_processor, email_sender

          # 1. 动态初始化并触发爬虫
          print('--- 正在初始化数据库并抓取数据 ---')
          crawler = data_crawler.DataCrawler()
          
          if hasattr(crawler, 'init_db'):
              crawler.init_db()

          # 自动寻找爬虫的入口方法
          crawler_methods = ['crawl', 'run', 'start', 'fetch_all', 'get_news', 'fetch_news']
          executed = False
          for method in crawler_methods:
              if hasattr(crawler, method):
                  print(f'正在执行爬虫方法: {method}()')
                  getattr(crawler, method)()
                  executed = True
                  break
          if not executed:
              print('警告: 未找到匹配的爬虫抓取方法，尝试直接初始化...')

          # 2. 读取并生成邮件内容
          print('--- 正在处理新闻内容 ---')
          processor = content_processor.ContentProcessor()
          news_content = ''
          processor_methods = ['get_latest_news_html', 'get_latest_news', 'process', 'generate_html']
          for method in processor_methods:
              if hasattr(processor, method):
                  print(f'正在获取新闻内容方法: {method}()')
                  news_content = getattr(processor, method)()
                  break

          # 3. 发送新闻邮件
          print('--- 正在发送邮件 ---')
          sender = email_sender.EmailSender()
          sender.send_email(news_content)
          print('🎉 每日自动抓取与发信流程成功完成！')
          "
