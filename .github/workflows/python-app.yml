name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run Direct Email Test
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import email_sender
          sender = email_sender.EmailSender()
          # 兼容不同方法名的发信测试
          if hasattr(sender, 'send_email'):
              try:
                  sender.send_email('${{ secrets.EMAIL_ADDRESS }}', 'GitHub Actions 自动测试', '<h1>测试成功！</h1>')
              except TypeError:
                  sender.send_email(to_email='${{ secrets.EMAIL_ADDRESS }}', subject='GitHub Actions 自动测试', content='<h1>测试成功！</h1>')
          elif hasattr(sender, 'send'):
              sender.send('${{ secrets.EMAIL_ADDRESS }}', 'GitHub Actions 自动测试', '<h1>测试成功！</h1>')
          print('Send test completed!')
          "
