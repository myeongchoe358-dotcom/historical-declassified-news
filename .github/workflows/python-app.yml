name: Python application

on:
  push:
    branches: [ "main" ]
  schedule:
    # 每天北京时间 08:00（UTC 时间 00:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Create .env File
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "EMAIL_ADDRESS=${EMAIL_ADDRESS}" > .env
          echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> .env

      - name: Run Main Workflow
        run: |
          python -c "
          import data_crawler, content_processor, email_sender

          # 1. 执行爬虫数据抓取与数据库初始化
          print('--- 正在初始化数据库并抓取数据 ---')
          crawler = data_crawler.DataCrawler()
          if hasattr(crawler, 'init_db'):
              crawler.init_db()
          crawler.run()

          # 2. 读取并生成邮件内容
          print('--- 正在处理新闻内容 ---')
          processor = content_processor.ContentProcessor()
          news_content = ''
          if hasattr(processor, 'get_latest_news_html'):
              news_content = processor.get_latest_news_html()
          elif hasattr(processor, 'get_latest_news'):
              news_content = processor.get_latest_news()

          # 3. 发送新闻邮件
          print('--- 正在发送邮件 ---')
          sender = email_sender.EmailSender()
          sender.send_email(news_content)
          print('🎉 每日自动抓取与发信流程完成！')
          "
