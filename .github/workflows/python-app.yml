name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Create .env file for configuration
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "EMAIL_ADDRESS=${EMAIL_ADDRESS}" > .env
          echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> .env

      - name: Run Email Sender Directly
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import os, sys
          from email_sender import EmailSender

          # 校验 Secrets 是否挂载成功
          email = os.environ.get('EMAIL_ADDRESS')
          password = os.environ.get('SMTP_PASSWORD')
          
          if not email or not password:
              print('❌ 错误：GitHub Secrets 中的 EMAIL_ADDRESS 或 SMTP_PASSWORD 未设置或未获取到！')
              sys.exit(1)

          test_content = '''
          <div style=\"padding:20px; background-color:#f4f4f4; font-family:sans-serif;\">
            <h2 style=\"color:#2b5797;\">🎉 GitHub Actions 测试成功！</h2>
            <p>您的发信模块、环境变量及 SMTP 配置均已完全通畅！</p>
          </div>
          '''

          try:
              sender = EmailSender()
              # 显式使用从环境变量或类中读取的参数发信
              sender.send_email(test_content)
              print('✅ 邮件已成功发送至 SMTP 服务器！')
          except Exception as e:
              print('❌ 发送邮件时发生错误：', e)
              sys.exit(1)
          "
