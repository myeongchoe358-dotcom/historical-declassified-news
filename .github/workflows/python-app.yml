name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest python-dotenv

      - name: Debug and Force Send Email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import os, sys
          from email_sender import EmailSender

          email = os.environ.get('EMAIL_ADDRESS')
          password = os.environ.get('SMTP_PASSWORD')

          print(f'Checking Env: EMAIL_ADDRESS is {\"SET\" if email else \"MISSING\"}')
          print(f'Checking Env: SMTP_PASSWORD is {\"SET\" if password else \"MISSING\"}')

          if not email or not password:
              raise ValueError('GitHub Secrets 中的 EMAIL_ADDRESS 或 SMTP_PASSWORD 未填写！')

          # 写入配置文件依赖
          with open('.env', 'w') as f:
              f.write(f'EMAIL_ADDRESS={email}\nSMTP_PASSWORD={password}\n')

          sender = EmailSender()
          print('Attempting to connect to SMTP server...')
          
          # 不使用 try-except，让真实的 SMTP 报错显现
          sender.send_email('<h1>GitHub Actions 测试</h1><p>发信测试中...</p>')
          print('SUCCESS: Email sent successfully!')
          "
