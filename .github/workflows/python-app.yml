name: Python application

on:
  push:
    branches: [ "main" ]
  schedule:
    # 每天北京时间 08:00（UTC 时间 00:00）自动触发执行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule pytest python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Create .env File
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "EMAIL_ADDRESS=${EMAIL_ADDRESS}" > .env
          echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> .env

      - name: Run Main Workflow
        run: |
          python -c "
          import data_crawler, content_processor, email_sender

          # 1. 初始化并运行爬虫抓取数据
          crawler = data_crawler.DataCrawler()
          crawler.init_db()
          crawler.run()

          # 2. 读取并处理新闻数据
          processor = content_processor.ContentProcessor()
          news_html = processor.get_latest_news_html()

          # 3. 发送新闻邮件
          sender = email_sender.EmailSender()
          sender.send_email(news_html)
          print('🎉 每日自动抓取与发信流程完成！')
          "
