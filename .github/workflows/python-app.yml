name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Send Raw Direct Email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import os, smtplib, sys
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          sender_email = os.environ.get('EMAIL_ADDRESS')
          password = os.environ.get('SMTP_PASSWORD')

          if not sender_email or not password:
              print('❌ 错误：GitHub Secrets 中的 EMAIL_ADDRESS 或 SMTP_PASSWORD 为空！')
              sys.exit(1)

          msg = MIMEMultipart()
          msg['From'] = sender_email
          msg['To'] = sender_email
          msg['Subject'] = '🎉 GitHub Actions 直连发信测试成功！'

          body = '<h1>测试成功！</h1><p>如果收到这封邮件，说明 Gmail 应用专用密码及 GitHub Secrets 配置完全正确！</p>'
          msg.attach(MIMEText(body, 'html'))

          try:
              print('正在连接 Gmail SMTP 服务器 (smtp.gmail.com:587)...')
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              print('正在验证密码...')
              server.login(sender_email, password)
              print('正在投递邮件...')
              server.sendmail(sender_email, sender_email, msg.as_string())
              server.quit()
              print('✅ SUCCESS: 邮件已成功通过 Gmail 服务器发送！')
          except Exception as e:
              print('❌ 发送失败，真实错误原因：', e)
              sys.exit(1)
          "
